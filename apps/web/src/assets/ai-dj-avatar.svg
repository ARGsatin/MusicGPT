<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MusicGPT AI DJ">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101834"/>
      <stop offset="100%" stop-color="#1c1039"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfeff"/>
      <stop offset="100%" stop-color="#d9e1ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色星空砖 + 极光 -->
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#halo)"/>
  <path d="M0 20 C 14 8 26 24 40 14 C 48 9 56 10 64 15 L64 0 L0 0 Z" fill="url(#aurora)" opacity="0.30"/>
  <path d="M0 54 C 14 46 28 58 42 50 C 50 46 58 48 64 52 L64 64 L0 64 Z" fill="url(#aurora)" opacity="0.16"/>

  <!-- 耳机头梁（压在头后） -->
  <path d="M15 31 v-4 a17 16 0 0 1 34 0 v4" fill="none" stroke="#2b3560" stroke-width="5" stroke-linecap="round"/>

  <!-- 脸 -->
  <rect x="16" y="23" width="32" height="25" rx="11" fill="url(#face)"/>

  <!-- 开心眯眯眼 -->
  <path d="M23.2 34 a3.3 3.3 0 0 1 6.6 0" fill="none" stroke="#141b3a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M34.2 34 a3.3 3.3 0 0 1 6.6 0" fill="none" stroke="#141b3a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 微笑 -->
  <path d="M28.5 40.5 q3.5 3 7 0" fill="none" stroke="#141b3a" stroke-width="2.1" stroke-linecap="round"/>

  <!-- 腮红 -->
  <circle cx="22.6" cy="39" r="1.9" fill="#f472b6" opacity="0.5"/>
  <circle cx="41.4" cy="39" r="1.9" fill="#f472b6" opacity="0.5"/>

  <!-- 耳罩（极光描边） -->
  <rect x="9.5" y="29" width="7.5" height="13" rx="3.75" fill="#232b52" stroke="url(#aurora)" stroke-width="1.5"/>
  <rect x="47" y="29" width="7.5" height="13" rx="3.75" fill="#232b52" stroke="url(#aurora)" stroke-width="1.5"/>

  <!-- 左耳罩上的迷你音浪 -->
  <path d="M11.8 33.2 v3.6 M13.6 32.2 v5.6 M15.4 33.2 v3.6" stroke="url(#aurora)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
